  state.primaryYear = String(META.current_year);
  state.cmpYear     = String(META.current_year-1);
  state.trendMode   = "ytd";
  state.trendWindow = "all";
  state.subwayRate  = false;
  state.boroRateMode = "count";
  state.mapMetric = "pct";
  state.mapView   = "count";
  state.mapPeriod = "ytd";
  state.ridershipView = "monthly";
  document.getElementById("sel-crime").value   = state.crime;
  document.getElementById("sel-primary").value = state.primaryYear;
  updatePrecinctDropdown();
}

// ── Top movers ───────────────────────────────────────────────────────────────
function renderMovers(crime, loc, boro, primaryYear, cmpYear, primaryQ, inPctMode, pct) {
  const crimeTypes = META.crime_types || [];
  const mode = state.moversMode || "pct"; // "pct" or "abs"

  const movers = crimeTypes.map(cr => {
    const cur = inPctMode ? getPctYTD(cr, pct, primaryYear, primaryQ, loc)
                          : getYTD(cr, loc, boro, primaryYear, primaryQ);
    const prv = inPctMode ? getPctYTD(cr, pct, cmpYear, primaryQ, loc)
                          : getYTD(cr, loc, boro, cmpYear, primaryQ);
    if (cur === 0 && prv === 0) return null;
    const absChange = cur - prv;
    const pctChange = prv > 0 ? ((cur - prv) / prv) * 100
                   : cur > 0  ? 100 : null;
    return { cr, cur, prv, absChange, pctChange };
  }).filter(m => m && m.pctChange !== null && (m.cur >= 10 || m.prv >= 10));

  // Sort by selected mode
  const sortKey = mode === "abs" ? "absChange" : "pctChange";
  const increases = [...movers].sort((a,b) => b[sortKey] - a[sortKey]).slice(0,5);
  const decreases = [...movers].sort((a,b) => a[sortKey] - b[sortKey]).slice(0,5);

  const geoLabel = inPctMode ? `Pct. ${pct}`
    : boro !== "All boroughs" ? boro : "Citywide";
  const locStr = loc === "subway" ? " · Subway"
    : loc === "housing" ? " · Housing" : "";
  const modeStr = mode === "abs" ? "by absolute change" : "by % change";

  document.getElementById("movers-up-title").textContent =
    `▲ Top 5 increases · ${primaryYear} vs ${cmpYear} · ${geoLabel}${locStr}`;
  document.getElementById("movers-down-title").textContent =
    `▼ Top 5 decreases · ${primaryYear} vs ${cmpYear} · ${geoLabel}${locStr}`;

  function formatName(s) {
    // Title case
    return s.toLowerCase().split(" ").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
  }
  function renderList(items, listId) {
    document.getElementById(listId).innerHTML = items.map(m => {
      const isUp = m.absChange >= 0;
      const cls = isUp ? "up" : "down";
      // Primary display value based on mode
      const primary = mode === "abs"
        ? `${isUp?"+":""}${fmt(m.absChange)}`
        : `${isUp?"+":""}${m.pctChange.toFixed(1)}%`;
      // Secondary value
      const secondary = mode === "abs"
        ? `${isUp?"+":""}${m.pctChange.toFixed(1)}%`
        : `${isUp?"+":""}${fmt(m.absChange)}`;
      return `<div class="mover-row">
        <div class="mover-name">${formatName(m.cr)}</div>
        <div class="mover-counts">${fmt(m.cur)} vs ${fmt(m.prv)}</div>
        <div style="text-align:right;">
          <div class="mover-pct ${cls}">${primary}</div>
          <div style="font-size:10px;color:var(--text3);">${secondary}</div>
        </div>
      </div>`;
    }).join("");
  }

  renderList(increases, "movers-up-list");
  renderList(decreases, "movers-down-list");
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const latestYear=META.current_year, curQ=META.current_quarter;
  const primaryYear=state.primaryYear||String(latestYear);
  const cmpYear=state.cmpYear;
  const crime=state.crime, loc=state.loc, boro=state.borough;
  const trendMode=state.trendMode||"ytd";

  // For metrics: use curQ if primary is latest year, else Q4 (full year)
  const isPrimaryLatest = String(primaryYear)===String(latestYear);
  const primaryQ = isPrimaryLatest ? curQ : "Q4";
  const primaryQIdx = QUARTERS.indexOf(primaryQ);

  // Precinct mode — override data access functions when a precinct is selected
  const pct = state.precinct;
  const inPctMode = !!(pct);

  // Show clear button and hide hint on map when a precinct is selected
  const mapClearBtn2 = document.getElementById("clear-precinct-map-btn");
  const mapHint = document.getElementById("map-hint");
  if (mapClearBtn2) mapClearBtn2.style.display = inPctMode ? "block" : "none";
  if (mapHint) mapHint.style.display = inPctMode ? "none" : "block";

  // Build & set location tag on every chart. Boro in black caps, precinct in orange caps.
  function chartLocationHTML() {
    let boroText = '';
    if (loc === "subway") boroText = "SUBWAY";
    else if (loc === "housing") boroText = "PUBLIC HOUSING";
    else if (inPctMode) {
      const pctBoro = PCT_BOROUGH[pct] || boro;
      boroText = pctBoro !== "All boroughs" ? pctBoro.toUpperCase() : "";
    }
    else if (boro !== "All boroughs") boroText = boro.toUpperCase();
    else boroText = "CITYWIDE";
    let pctText = "";
    if (inPctMode) {
      const pctName = PRECINCT_NAMES[pct] || "";
      const sep = boroText ? ' · ' : '';
      pctText = `<span class="pct-tag">${sep}PCT. ${pct}${pctName ? ' · ' + pctName.toUpperCase() : ''}</span>`;
    }
    // Append crime type in the same line
    const crimeText = (state.crime || "").toUpperCase();
    const crimeSuffix = crimeText ? ` · ${crimeText}` : "";
    return boroText + pctText + crimeSuffix;
  }
  const locHTML = chartLocationHTML();
  ["qtr-location","trend-location","monthly-location","boro-location","map-location","movers-location"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = locHTML;
  });
  // Also populate the crime type header on each chart (in cerulean blue)
  const crimeDisplay = crime;



  // isRate must be defined before geo labels (locLabel2 depends on it)
  const isRate = state.subwayRate;
  const rateNote = document.getElementById("subway-rate-note");
  if (rateNote) rateNote.style.display = isRate ? "block" : "none";

  // Show projected-ridership note if any months were projected from prior year
  const ridershipNoteEl = document.getElementById("ridership-note");
  if (ridershipNoteEl) {
    if (isRate && loc === "subway" && META.ridership_notes && META.ridership_notes.length > 0) {
      const notes = META.ridership_notes.map(n => n.note).join(" · ");
      ridershipNoteEl.textContent = "Note: " + notes;
      ridershipNoteEl.style.display = "block";
    } else {
      ridershipNoteEl.style.display = "none";
    }
  }

  // Geography labels — used across all chart subtitles
  const geoShort = inPctMode
    ? `Pct. ${pct}`
    : boro !== "All boroughs" ? boro : "Citywide";
  const geoLabel = inPctMode
    ? ` · ${pctLabel(pct)}`
    : boro !== "All boroughs" ? ` · ${boro}` : " · Citywide";
  const locLabel2 = loc === "subway"
    ? (isRate ? "Subway — rate" : "Subway — count")
    : loc === "housing" ? "Housing" : "";
  const fullGeoLabel = locLabel2 ? `${geoLabel} · ${locLabel2}` : geoLabel;

  // Crime label for chart subtitles — title case, shortened if needed
  function formatCrimeName(s) {
    if (!s) return "";
    return s.toLowerCase().split(" ").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
  }
  const crimeLabel = formatCrimeName(crime);

  function getC(cr, lc, bo, yr, q) {
    return inPctMode ? getPctCount(cr, pct, yr, q, lc) : getCount(cr, lc, bo, yr, q);
  }
  function getY(cr, lc, bo, yr, upToQ) {
    return inPctMode ? getPctYTD(cr, pct, yr, upToQ, lc) : getYTD(cr, lc, bo, yr, upToQ);
  }

  // Metrics — YTD + all 4 quarters


  const pYTD=getY(crime,loc,boro,primaryYear,primaryQ);
  const cYTD=getY(crime,loc,boro,cmpYear,primaryQ);

  // Convert to rates if needed
  function displayVal(count, year, q, upToQ) {
    if (!isRate) return fmt(count);
    const r = toRate(count, loc, boro, year, q, upToQ);
    return r == null ? "n/a" : fmtRate(r, loc);
  }
  function displayDelta(pCount, cCount, year, q, upToQ) {
    if (!isRate) return deltaDisplay(pCount, cCount, cmpYear);
    const pR = toRate(pCount, loc, boro, primaryYear, q, upToQ);
    const cR = toRate(cCount, loc, boro, cmpYear,    q, upToQ);
    if (pR == null || cR == null) return {text:"Rate unavailable", cls:"delta-flat"};
    return deltaDisplay(pR, cR, cmpYear);
  }

  const ytdLabel = isRate
    ? `YTD ${primaryYear} · ${rateLabel(loc)}`
    : `YTD · ${crimeLabel}`;
  const ytdMetric = {
    label: ytdLabel,
    val: displayVal(pYTD, primaryYear, null, primaryQ),
    delta: displayDelta(pYTD, cYTD, primaryYear, null, primaryQ),
    isYTD:true
  };
  const qtrMetrics = QUARTERS.map(q=>{
    const pVal=getC(crime,loc,boro,primaryYear,q);
    const cVal=getC(crime,loc,boro,cmpYear,q);
    const available = QUARTERS.indexOf(q)<=primaryQIdx;
    return {
      label:`${q} ${primaryYear}`,
      val: available ? displayVal(pVal, primaryYear, q, null) : "—",
      delta: available ? displayDelta(pVal, cVal, primaryYear, q, null) : {text:"Not yet available",cls:"delta-flat"},
      isYTD:false
    };
  });
  const allMetrics = [ytdMetric, ...qtrMetrics];
  // Build a location tag shown at the top of each metric card
  let locationTag;
  if (inPctMode) {
    const pctBoro = PCT_BOROUGH[pct] || (boro !== "All boroughs" ? boro : "");
    const pctName = PRECINCT_NAMES[pct] || "";
    locationTag = (pctBoro ? pctBoro + " · " : "") + `Pct. ${pct}` + (pctName ? ` · ${pctName}` : "");
  } else if (loc === "subway") locationTag = "Subway";
  else if (loc === "housing") locationTag = "Public housing";
  else if (boro !== "All boroughs") locationTag = boro;
  else locationTag = "Citywide";
  const locationTagColor = (inPctMode || boro !== "All boroughs" || loc !== "citywide") ? "var(--orange)" : "var(--charcoal)";
  // Use same location HTML format as chart location tags (uppercase caps)
  const ytdLocationHTML = chartLocationHTML();
  document.getElementById("metrics-row").innerHTML = allMetrics.map(m=>{
    if (m.isYTD) {
      return `<div class="metric ytd-metric">
        <div class="chart-location" style="margin-bottom:8px;">${ytdLocationHTML}</div>
        <div class="m-title">YTD</div>
        <div class="m-val">${m.val}</div>
        <div class="m-delta ${m.delta.cls}">${m.delta.text}</div>
      </div>`;
    }
    return `<div class="metric">
      <div class="m-label">${m.label}</div>
      <div class="m-val">${m.val}</div>
      <div class="m-delta ${m.delta.cls}">${m.delta.text}</div>
    </div>`;
  }).join("");

  // Monthly bars
  const maxMonth=(primaryQIdx+1)*3;
  const mnths=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function qForM(m){return m<=3?"Q1":m<=6?"Q2":m<=9?"Q3":"Q4";}
  function monthly(year,upToQ){
    const uIdx=QUARTERS.indexOf(upToQ);
    return Array.from({length:12},(_,i)=>{
      const m=i+1, q=qForM(m);
      if(QUARTERS.indexOf(q)>uIdx) return 0;
      let raw;
      if (inPctMode) {
        // Precinct mode — use real monthly data split by loc_type
        const sliceKey = loc === "subway" ? "subway" : loc === "housing" ? "housing" : "citywide";
        const hasPctMonthly = PCT_MONTHLY_DATA[sliceKey]?.[crime]?.[`pct_${pct}`]?.[String(year)];
        raw = hasPctMonthly
          ? getPctMonthlyCount(crime, pct, year, m, loc)
          : Math.round(getC(crime,loc,boro,year,q)/3);
      } else if (boro !== "All boroughs") {
        // Specific borough — use borough monthly data
        const locKey = loc==="subway"?"subway":loc==="housing"?"housing":"citywide";
        const hasMonthly = MONTHLY_DATA[crime]?.[locKey]?.[boro]?.[String(year)];
        raw = hasMonthly
          ? getMonthlyCount(crime, loc, boro, year, m)
          : Math.round(getC(crime,loc,boro,year,q)/3);
      } else {
        // All boroughs — use citywide monthly data
        const locKey = loc==="subway"?"subway":loc==="housing"?"housing":"citywide";
        const hasMonthly = MONTHLY_DATA[crime]?.[locKey]?.["All boroughs"]?.[String(year)];
        raw = hasMonthly
          ? getMonthlyCount(crime, loc, "All boroughs", year, m)
          : Math.round(getC(crime,loc,boro,year,q)/3);
      }
      if (!isRate) return raw;
      // Use real monthly ridership from MTA API (2018+), quarterly/3 estimate pre-2018
      if (loc === "subway") {
        const monthlyRides = getSubwayRidershipMonth(year, m);
        if (!monthlyRides) return 0;
        return Math.round((raw / monthlyRides) * 1000000 * 10) / 10;
      } else {
        const pop = getPopulation(year, boro);
        if (!pop) return 0;
        return Math.round((raw / pop) * 100000 * 10) / 10;
      }
    });
  }
  document.getElementById("monthly-sub").textContent=`${crimeLabel} · ${primaryYear} vs ${cmpYear} · Q1–${primaryQ}${fullGeoLabel}`;
  document.getElementById("monthly-legend").innerHTML=`
    <span><span class="leg-dot" style="background:${C_CMP}"></span>${cmpYear}</span>
    <span><span class="leg-dot" style="background:${C_CUR}"></span>${primaryYear}</span>`;
  drawBars("chart-monthly", mnths, [
    {label:String(cmpYear), data:monthly(cmpYear, isPrimaryLatest?curQ:"Q4"), color:C_CMP},
    {label:String(primaryYear), data:monthly(primaryYear, primaryQ), color:C_CUR},
  ], "tt-monthly");

  // Borough bars vs Ridership chart — swap based on location
  const boroSection = document.querySelector(".two-col");
  const boroTitle    = document.getElementById("boro-chart-title");
  const boroLegendEl = document.getElementById("boro-legend");
  const boroListEl   = document.getElementById("boro-list");
  const boroToggleEl = document.getElementById("boro-rate-toggle");
  const ridershipCanvas = document.getElementById("chart-ridership");

  if (loc === "subway") {
    // Show subway ridership chart, hide borough bars
    const rView = state.ridershipView || "monthly";
    const viewTitle = rView === "ytd" ? "YTD" : rView === "annual" ? "annual" : "monthly";
    if (boroTitle) boroTitle.textContent = `Subway ridership — ${viewTitle}`;
    boroToggleEl.style.display = "none";
    boroLegendEl.style.display = "block";
    boroListEl.style.display = "none";
    document.getElementById("ridership-view-toggle").style.display = "";
    ridershipCanvas.style.display = "block";

    if (rView === "monthly") {
      // Bar chart: primary year vs comparison year, month by month
      const rLabels = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      let rCur = rLabels.map((_,i) => (getSubwayRidershipMonth(primaryYear, i+1) || 0) / 1000000);
      let rCmp = rLabels.map((_,i) => (getSubwayRidershipMonth(cmpYear, i+1) || 0) / 1000000);
      document.getElementById("boro-sub").textContent =
        `Millions of rides · ${primaryYear} vs ${cmpYear}`;
      document.getElementById("boro-legend").innerHTML = `
        <span><span class="leg-dot" style="background:#dddddd"></span>${cmpYear}</span>
        <span><span class="leg-dot" style="background:#9b9fbc"></span>${primaryYear}</span>`;
      drawBars("chart-ridership", rLabels, [
        {label: String(cmpYear),     data: rCmp, color: "#dddddd"},
        {label: String(primaryYear), data: rCur, color: "#9b9fbc"},
      ], "tt-ridership");
    } else {
      // Line chart for YTD or Annual — keep values as raw rides, format with M/B
      const trendWindow = state.trendWindow || "all";
      const dataYears = getAllYears();
      const maxYr = parseInt(primaryYear);
      const windowStart = trendWindow === "10yr"       ? maxYr - 9
                        : trendWindow === "prepandemic" ? 2019
                        : trendWindow === "5yr"         ? maxYr - 4
                        : 2006;
      const minYr = Math.max(windowStart, Math.min(...dataYears, 2006));
      const allYrs = [];
      for (let y = minYr; y <= maxYr; y++) allYrs.push(y);
      const isYtd = rView === "ytd";
      // For annual, exclude current year if it's not complete (not through Q4)
      const excludeCurrentYear = !isYtd && String(primaryYear) === String(latestYear) && primaryQ !== "Q4";
      const displayYrs = excludeCurrentYear ? allYrs.filter(y => y < maxYr) : allYrs;
      const rData = displayYrs.map(y => {
        const quarters = ["Q1","Q2","Q3","Q4"];
        const upToIdx = isYtd ? quarters.indexOf(primaryQ) : 3;
        let total = 0;
        for (let i = 0; i <= upToIdx; i++) {
          total += getSubwayRidership(y, quarters[i]) || 0;
        }
        return total;
      });
      // Formatter: 1.2B, 850M, etc.
      const fmtRides = v => {
        if (v >= 1e9)   return (v/1e9).toFixed(1) + "B";
        if (v >= 1e6)   return Math.round(v/1e6) + "M";
        if (v >= 1000)  return Math.round(v/1000) + "K";
        return String(Math.round(v));
      };
      const displayMaxYr = displayYrs[displayYrs.length - 1];
      const subLabel = isYtd
        ? `Total rides · YTD Q1–${primaryQ} · ${minYr}–${maxYr}`
        : `Total rides · Annual · ${minYr}–${displayMaxYr}${excludeCurrentYear ? ` (${maxYr} excluded — year in progress)` : ""}`;
      document.getElementById("boro-sub").textContent = subLabel;
      document.getElementById("boro-legend").innerHTML = "";
      drawLine("chart-ridership", displayYrs.map(String), rData,
               isYtd ? primaryYear : displayMaxYr, cmpYear, "tt-ridership", null, null, false,
               "#9b9fbc", "total rides", fmtRides);
    }
  } else if (inPctMode) {
    // Precinct mode — show all precincts in the same borough ranked by current crime
    if (boroTitle) boroTitle.textContent = `Precincts in ${PCT_BOROUGH[pct] || boro}`;
    boroToggleEl.style.display = "none";
    boroLegendEl.style.display = "none";
    boroListEl.style.display = "block";
    // Cap height and enable scroll so the card stays compact
    boroListEl.style.maxHeight = "340px";
    boroListEl.style.overflowY = "auto";
    boroListEl.style.paddingRight = "6px";
    ridershipCanvas.style.display = "none";
    document.getElementById("ridership-view-toggle").style.display = "none";

    // Get all precincts in the same borough
    const pctBoro = PCT_BOROUGH[pct] || boro;
    const siblingPcts = Object.keys(PCT_BOROUGH)
      .filter(p => PCT_BOROUGH[p] === pctBoro)
      .map(p => parseInt(p))
      .filter(p => !isNaN(p));

    // Compute count for each sibling precinct
    const pctData = siblingPcts.map(p => {
      const rawVal = getPctYTD(crime, p, primaryYear, primaryQ, loc);
      return {
        pct: p,
        name: PRECINCT_NAMES[p] || "",
        val: rawVal,
        isSelected: p === pct
      };
    })
    .filter(p => p.val != null && p.val >= 0)
    .sort((a, b) => b.val - a.val);

    const pctMax = Math.max(...pctData.map(p => p.val), 1);
    document.getElementById("boro-sub").textContent =
      `${crimeLabel} · ${primaryYear} · Q1–${primaryQ}`;

    document.getElementById("boro-list").innerHTML = pctData.map(p => {
      const w = pctMax > 0 ? (p.val / pctMax * 100).toFixed(1) : "0";
      const barColor = p.isSelected ? "#ff7c53" : "#c8c8c8";
      const textWeight = p.isSelected ? "700" : "500";
      const textColor = p.isSelected ? "#ff7c53" : "var(--text)";
      const label = `Pct. ${p.pct}${p.name ? " · " + p.name : ""}`;
      return `<div>
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
          <span style="font-weight:${textWeight};color:${textColor};">${label}${p.isSelected ? " ← selected" : ""}</span>
          <span style="color:var(--text2);font-weight:${textWeight};">${fmt(p.val)}</span>
        </div>
        <div class="boro-bar-bg"><div class="boro-bar-fill" style="width:${w}%;background:${barColor};"></div></div>
      </div>`;
    }).join("");
  } else {
    // Restore borough bars view
    if (boroTitle) boroTitle.textContent = "By borough — YTD";
    boroToggleEl.style.display = "";
    boroLegendEl.style.display = "";
    boroListEl.style.display = "";
    // Reset scroll styles set by precinct mode
    boroListEl.style.maxHeight = "";
    boroListEl.style.overflowY = "";
    boroListEl.style.paddingRight = "";
    ridershipCanvas.style.display = "none";
    document.getElementById("ridership-view-toggle").style.display = "none";

    // Borough bars — use rate if boro rate toggle is on AND we're in citywide
    const boroRateAvail = state.boroRateMode === "rate" && loc === "citywide";
    const boroData=["Bronx","Brooklyn","Manhattan","Queens","Staten Island"]
      .map(b=>{
        const rawVal=getYTD(crime,loc,b,primaryYear,primaryQ);
        let displayVal = rawVal;
        if (boroRateAvail) {
          const r = toRate(rawVal, loc, b, primaryYear, null, primaryQ);
          displayVal = r == null ? null : r;
        }
        return {name:b, val:displayVal, rawVal, color:BORO_COLORS[b]};
      })
      .filter(b=>b.val!=null)
      .sort((a,b)=>b.val-a.val);
    const boroMax=Math.max(...boroData.map(b=>b.val),1);
    const boroTotal=boroData.reduce((s,b)=>s+b.rawVal,0);
    const boroSubLabel = boroRateAvail
      ? `${crimeLabel} · ${primaryYear} · Q1–${primaryQ} · ${rateLabel(loc)}${locLabel2 ? " · "+locLabel2 : ""}`
      : `${crimeLabel} · ${primaryYear} · Q1–${primaryQ}${locLabel2 ? " · "+locLabel2 : ""}`;
    document.getElementById("boro-sub").textContent=boroSubLabel;
    document.getElementById("boro-legend").innerHTML=boroData.map(b=>`
      <span><span class="leg-dot" style="background:${b.color}"></span>${b.name}</span>`).join("");
    document.getElementById("boro-list").innerHTML=boroData.map(b=>{
      const pct=boroTotal>0?((b.rawVal/boroTotal)*100).toFixed(1):"0.0";
      const w=boroMax>0?(b.val/boroMax*100).toFixed(1):"0";
      const displayStr = boroRateAvail ? fmtRate(b.val, loc) : fmt(b.val);
      const suffix = boroRateAvail ? "" : ` <span style="opacity:0.7;">(${pct}%)</span>`;
      return `<div>
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
          <span style="font-weight:600;">${b.name}</span>
          <span style="color:var(--text2);">${displayStr}${suffix}</span>
        </div>
        <div class="boro-bar-bg"><div class="boro-bar-fill" style="width:${w}%;background:${b.color};"></div></div>
      </div>`;
    }).join("");
  }

  // Quarter comparison — always show all 4, gray out unavailable
  // Geography label used across all chart subtitles
  document.getElementById("qtr-sub").textContent=`${crimeLabel} · ${primaryYear} vs ${cmpYear}${fullGeoLabel}`;
  document.getElementById("qtr-legend").innerHTML=`
    <span><span class="leg-dot" style="background:${C_CMP}"></span>${cmpYear}</span>
    <span><span class="leg-dot" style="background:${C_CUR}"></span>${primaryYear}</span>`;
  const qtrCmpData  = QUARTERS.map(q => {
    const v = getC(crime,loc,boro,cmpYear,q);
    return isRate ? (toRate(v,loc,boro,cmpYear,q,null)||0) : v;
  });
  const qtrCurData  = QUARTERS.map(q => {
    const v = getC(crime,loc,boro,primaryYear,q);
    return isRate ? (toRate(v,loc,boro,primaryYear,q,null)||0) : v;
  });
  drawBars("chart-qtr", QUARTERS, [
    {label:String(cmpYear), data:qtrCmpData, color:C_CMP},
    {label:String(primaryYear), data:qtrCurData, color:C_CUR},
  ], "tt-qtr");

  // Trend line
  const dataYears=getAllYears();
  const maxYr=parseInt(primaryYear);
  // Apply trend window filter
  const trendWindow = state.trendWindow || "all";
  const windowStart = trendWindow === "10yr"       ? maxYr - 9
                    : trendWindow === "prepandemic" ? 2019
                    : trendWindow === "5yr"         ? maxYr - 4
                    : 2006; // "all"
  const minYr=Math.max(windowStart, Math.min(...dataYears, 2006));
  const allYrs=Array.from({length:maxYr-minYr+1},(_,i)=>minYr+i);

  if(trendMode==="ytd"){
    const rawData=allYrs.map(y=>getY(crime,loc,boro,y,curQ));
    const tData = isRate
      ? rawData.map((v,i)=>{ const r=toRate(v,loc,boro,allYrs[i],null,curQ); return r==null?0:r; })
      : rawData;
    const subLabel = isRate ? ` · ${rateLabel(loc)}` : "";
    document.getElementById("trend-sub").textContent=`${crimeLabel} · YTD through ${curQ} each year · ${minYr}–${maxYr}${subLabel}${fullGeoLabel}`;
    drawLine("chart-trend", allYrs.map(String), tData, primaryYear, cmpYear, "tt-trend", null, null, isRate);

  } else if(trendMode==="quarterly"){
    const qLabels=[], qData=[];
    // Determine cutoff: stop at primaryYear's primaryQ, not latestYear's curQ
    const trendCutoffYear = parseInt(primaryYear);
    const trendCutoffQIdx = primaryQIdx;
    allYrs.forEach(y=>{
      QUARTERS.forEach(q=>{
        const qI = QUARTERS.indexOf(q);
        // Skip years beyond primaryYear
        if(y > trendCutoffYear) return;
        // For the cutoff year, only show quarters up to primaryQ
        if(y === trendCutoffYear && qI > trendCutoffQIdx) return;
        // For the latest calendar year, skip quarters with no data yet
        if(y === latestYear && qI > QUARTERS.indexOf(curQ)) return;
        qLabels.push(`${y} ${q}`);
        const raw = getC(crime,loc,boro,y,q);
        if (isRate) {
          const r = toRate(raw, loc, boro, y, q, null);
          qData.push(r==null ? 0 : r);
        } else {
          qData.push(raw);
        }
      });
    });
    const xLabels=qLabels.map((l)=>{
      if(!l.endsWith("Q1")) return "";
      const yr=parseInt(l.split(" ")[0]);
      return (yr-2006)%2===0 ? String(yr) : "";
    });
    const subLabel = isRate ? ` · ${rateLabel(loc)}` : "";
    document.getElementById("trend-sub").textContent=`${crimeLabel} · Each quarter · ${minYr}–${maxYr}${subLabel}${fullGeoLabel}`;
    drawLine("chart-trend", qLabels, qData, null, null, "tt-trend", xLabels, null, isRate);

  } else { // annual
    const isFullYear = y => !(y===latestYear && curQ!=="Q4");
    const rawAnnual = allYrs.map(y=>getY(crime,loc,boro,y,"Q4"));
    const aData = isRate
      ? rawAnnual.map((v,i)=>{ const r=toRate(v,loc,boro,allYrs[i],null,"Q4"); return r==null?0:r; })
      : rawAnnual;
    const incomplete=allYrs.map(y=>!isFullYear(y));
    // Vital City: in ANNUAL mode, drop a trailing incomplete year entirely
    // (don't render the dashed partial-year segment — it reads poorly and the year isn't done).
    let annYrs = allYrs, annData = aData, annIncomplete = incomplete;
    if (annIncomplete.length && annIncomplete[annIncomplete.length-1]) {
      annYrs = allYrs.slice(0, -1);
      annData = aData.slice(0, -1);
      annIncomplete = incomplete.slice(0, -1);
    }
    const subLabel = isRate ? ` · ${rateLabel(loc)}` : "";
    document.getElementById("trend-sub").textContent=`${crimeLabel} · Full year totals · ${minYr}–${annYrs[annYrs.length-1]||maxYr}${subLabel}${fullGeoLabel}`;
    drawLine("chart-trend", annYrs.map(String), annData, primaryYear, cmpYear, "tt-trend", null, annIncomplete, isRate);
  }
  // Top movers
  renderMovers(crime, loc, boro, primaryYear, cmpYear, primaryQ, inPctMode, pct);

  // Map
  renderMap(crimeLabel, curQ, latestYear);
}

// ── Canvas renderers ──────────────────────────────────────────────────────────
function getCanvas(id, h) {
  const c = document.getElementById(id);
  const W = c.parentElement.clientWidth || 500;
  const H = h || 220;
  c.width = W * devicePixelRatio;
  c.height = H * devicePixelRatio;
  c.style.width = W + "px";
  c.style.height = H + "px";
  const ctx = c.getContext("2d");
  ctx.scale(devicePixelRatio, devicePixelRatio);
  return {ctx, W, H};
}

function showTooltip(ttId, canvas, mouseX, mouseY, lines) {
  const tt = document.getElementById(ttId);
  if (!tt || !lines) { if(tt) tt.classList.remove("visible"); return; }
  tt.innerHTML = lines.join("");
  tt.classList.add("visible");
  // Convert canvas-local coords to viewport coords for position:fixed
  const rect = canvas.getBoundingClientRect();
  const vx = rect.left + mouseX;
  const vy = rect.top  + mouseY;
  const ttW = tt.offsetWidth || 200;
  const ttH = tt.offsetHeight || 80;
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = vx + 14;
  let top  = vy - ttH / 2;
  if (left + ttW > vw - 8) left = vx - ttW - 14;
  if (top < 8) top = 8;
  if (top + ttH > vh - 8) top = vh - ttH - 8;
  tt.style.left = left + "px";
  tt.style.top  = top + "px";
}

function hideTooltip(ttId) {
  const tt = document.getElementById(ttId);
  if (tt) tt.classList.remove("visible");
}

function drawBars(id, labels, datasets, ttId) {
  const {ctx, W, H} = getCanvas(id, 220);
  const PL=44, PR=8, PT=10, PB=28;
  const cW=W-PL-PR, cH=H-PT-PB;
  const allV=datasets.flatMap(d=>d.data).filter(v=>v>0);
  const mx=Math.max(...allV,1);
  const mn=Math.min(...allV,0);
  // Use dynamic min for small-range data (like rates)
  const range = mx - mn;
  // Use dynamic axis for small or decimal values (like rates)
  const isDecimal = mx < 100;
  const isSmallRange = !isDecimal && range < mx * 0.3 && mn > 0;
  let barMin, niceMax;
  if (isDecimal) {
    // Rates — start near min, end near max
    barMin = Math.max(0, Math.floor(mn * 0.8 * 10)/10);
    niceMax = Math.ceil(mx * 1.2 * 10) / 10 || 1;
  } else if (isSmallRange) {
    barMin = Math.max(0, Math.floor(mn * 0.85 * 10)/10);
    niceMax = Math.ceil(mx * 1.15 * 10) / 10 || 1;
  } else {
    barMin = 0;
    // Choose a "nice" step that divides evenly by 4 (so tick labels are clean)
    // Pick step sizes based on magnitude, aiming for 4 ticks between 0 and niceMax
    const roughMax = mx * 1.12;
    const magnitude = Math.pow(10, Math.floor(Math.log10(roughMax)));
    const normalized = roughMax / magnitude; // 1-10 range
    let stepMultiplier;
    if (normalized <= 2) stepMultiplier = 0.5;
    else if (normalized <= 5) stepMultiplier = 1;
    else stepMultiplier = 2.5;
    const stepSize = magnitude * stepMultiplier;
    niceMax = Math.ceil(roughMax / stepSize) * stepSize || 1;
  }
  const TICKS=4;
  const n=labels.length, ds=datasets.length;
  const groupW=cW/n;
  const barW=Math.min((groupW*0.75)/ds, 36);
  const gapX=(groupW-barW*ds)/2;

  function paint(hovIdx) {
    ctx.clearRect(0,0,W,H);
    // Grid + y labels
    for(let i=0;i<=TICKS;i++){
      const v=(niceMax/TICKS)*i, y=PT+cH-(v/niceMax)*cH;
      ctx.strokeStyle=C_GRID; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(PL,y); ctx.lineTo(PL+cW,y); ctx.stroke();
      ctx.fillStyle=C_LABEL; ctx.font="10px 'halyard-text','Inter','Helvetica Neue',Arial,sans-serif";
      ctx.textAlign="right"; ctx.fillText(fmtK(Math.round(v)),PL-5,y+3.5);
    }
    // Hover column highlight
    if (hovIdx >= 0) {
      ctx.fillStyle="rgba(5,5,7,0.04)";
      ctx.fillRect(PL+hovIdx*groupW, PT, groupW, cH);
    }
    // Bars
    datasets.forEach((d,di)=>{
      d.data.forEach((v,i)=>{
        const bH=(v/niceMax)*cH;
        const x=PL+i*groupW+gapX+di*barW;
        ctx.fillStyle = (hovIdx===i) ? d.color : d.color + "cc";
        // Vital City redesign: rounded bar tops (radius capped at half-width / bar-height)
        (function(){
          const bw = barW-1, bx = x, by = PT+cH-bH, bhh = bH;
          const rad = Math.max(0, Math.min(3, bw/2, bhh));
          ctx.beginPath();
          ctx.moveTo(bx, by+bhh);
          ctx.lineTo(bx, by+rad);
          ctx.quadraticCurveTo(bx, by, bx+rad, by);
          ctx.lineTo(bx+bw-rad, by);
          ctx.quadraticCurveTo(bx+bw, by, bx+bw, by+rad);
          ctx.lineTo(bx+bw, by+bhh);
          ctx.closePath();
          ctx.fill();
        })();
      });
    });
    // X labels
    ctx.fillStyle=C_LABEL; ctx.textAlign="center"; ctx.font="10px 'halyard-text','Inter','Helvetica Neue',Arial,sans-serif";
    labels.forEach((lbl,i)=>{ ctx.fillText(lbl, PL+i*groupW+groupW/2, H-6); });
    // Axis
    ctx.strokeStyle=C_AXIS; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PL,PT+cH); ctx.lineTo(PL+cW,PT+cH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PL,PT); ctx.lineTo(PL,PT+cH); ctx.stroke();
  }

  paint(-1);

  const canvas = document.getElementById(id);
  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const i = Math.floor((mx - PL) / groupW);
    if (i >= 0 && i < n) {
      paint(i);
      // Compute % change between first and last dataset (cmp → primary)
      let pctLine = "";
      if (datasets.length >= 2) {
        const cmpVal = datasets[0].data[i];
        const curVal = datasets[datasets.length-1].data[i];
        if (cmpVal > 0) {
          const pct = ((curVal - cmpVal) / cmpVal) * 100;
          const sign = pct > 0 ? "+" : "";
          const arrow = pct > 0 ? "▲" : pct < 0 ? "▼" : "▬";
          const col = pct > 0 ? "#c0392b" : pct < 0 ? "#2d8a3e" : "#707175";
          const cmpLbl = datasets[0].label || "prior year";
          pctLine = `<div style="color:${col};font-weight:700;font-size:12px;">${arrow} ${sign}${pct.toFixed(1)}% vs ${cmpLbl}</div>`;
        }
      }
      // Build white-card style tooltip
      const ttLines = [
        `<strong>${labels[i]}</strong>`,
        `<hr style="border:none;border-top:1px solid #ebebeb;margin:5px 0;">`,
        ...datasets.map(d => `<div style="display:flex;align-items:center;gap:6px;margin-bottom:1px;"><span style="display:inline-block;width:10px;height:10px;background:${d.color};flex-shrink:0;"></span><span style="color:#707175;font-size:11px;">${d.label}:</span>&nbsp;<strong style="font-size:12px;">${d.data[i].toLocaleString()}</strong></div>`),
        ...(pctLine ? [`<hr>${pctLine}`] : [])
      ];
      showTooltip(ttId, canvas, mx, my, ttLines);
    } else {
      paint(-1); hideTooltip(ttId);
    }
  };
  canvas.onmouseleave = () => { paint(-1); hideTooltip(ttId); };
}

function drawLine(id, labels, data, curYear, cmpYear, ttId, xOverride, incomplete, rateMode, lineColor, unitLabel, yFormatter) {
  // xOverride: array of display labels for x-axis (sparse, empty string = skip)
  // incomplete: array of booleans — true = this point is partial data
  const {ctx, W, H} = getCanvas(id, 200);
  const PL=44, PR=40, PT=14, PB=28;
  const cW=W-PL-PR, cH=H-PT-PB;
  const validData=data.filter(v=>v>0);
  const mx=Math.max(...(validData.length?validData:[1]));
  const mn=Math.min(...(validData.length?validData:[0]));
  const hasZeros = data.some(v=>v===0);
  // If any zeros exist, always start at 0 to avoid lines going off chart
  const range = mx - mn;
  const padTop = range > 0 ? range * 0.25 : mx * 0.15;
  const padBot = (!hasZeros && range > 0) ? range * 0.15 : 0;
  const rawMin = hasZeros ? 0 : Math.max(0, mn - padBot);
  const rawMax = mx + padTop;
  const magnitude = Math.pow(10, Math.floor(Math.log10(rawMax - rawMin || 1)));
  const niceMin = hasZeros ? 0 : Math.floor(rawMin / magnitude) * magnitude;
  const niceMax = Math.ceil(rawMax / magnitude) * magnitude || 1;
  const TICKS=4;
  const n=labels.length;
  // Add half-step padding on each side so first/last points aren't at edges
  const step=cW/Math.max(n,1);

  function px(i){return PL+step/2+i*step;}
  function py(v){return PT+cH-((v-niceMin)/(niceMax-niceMin))*cH;}

  function paint(hovIdx) {
    ctx.clearRect(0,0,W,H);
    // Clipping region — lines stay within chart area
    ctx.save();
    ctx.beginPath();
    ctx.rect(PL, PT, cW, cH);
    ctx.clip();
    ctx.restore();
    // Grid + y labels
    for(let i=0;i<=TICKS;i++){
      const v=niceMin+(niceMax-niceMin)/TICKS*i;
      const y=PT+cH-((v-niceMin)/(niceMax-niceMin))*cH;
      ctx.strokeStyle=C_GRID; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(PL,y); ctx.lineTo(PL+cW,y); ctx.stroke();
      ctx.fillStyle=C_LABEL; ctx.font="10px 'halyard-text','Inter','Helvetica Neue',Arial,sans-serif";
      ctx.textAlign="right";
      const lbl = yFormatter ? yFormatter(v) : (v < 100 ? v.toFixed(1) : fmtK(Math.round(v)));
      ctx.fillText(lbl, PL-5, y+3.5);
    }
    // Hover vertical line
    if(hovIdx>=0){
      ctx.strokeStyle="rgba(5,5,7,0.12)"; ctx.lineWidth=1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(px(hovIdx),PT); ctx.lineTo(px(hovIdx),PT+cH); ctx.stroke();
      ctx.setLineDash([]);
    }
    // Clip to chart area so lines don't overflow
    ctx.save();
    ctx.beginPath();
    ctx.rect(PL-1, PT, cW+2, cH+1);
    ctx.clip();

    // Solid segment of line (complete data)
    ctx.beginPath(); ctx.strokeStyle=lineColor||C_TREND; ctx.lineWidth=2;
    let started=false;
    data.forEach((v,i)=>{
      if(incomplete&&incomplete[i]){ if(started){ctx.stroke(); started=false;} return; }
      if(!started){ctx.moveTo(px(i),py(v));started=true;}
      else ctx.lineTo(px(i),py(v));
    });
    if(started) ctx.stroke();
    // Dashed segment for incomplete data
    if(incomplete&&incomplete.some(Boolean)){
      ctx.beginPath(); ctx.strokeStyle=lineColor||C_TREND; ctx.lineWidth=2;
      ctx.setLineDash([4,4]);
      let inSeg=false;
      // Connect last complete point to first incomplete
      const lastComplete=data.reduce((last,_,i)=>(!incomplete||!incomplete[i])?i:last,-1);
      if(lastComplete>=0){
        ctx.moveTo(px(lastComplete),py(data[lastComplete]));
        data.forEach((v,i)=>{
          if(incomplete&&incomplete[i]) { ctx.lineTo(px(i),py(v)); }
        });
      }
      ctx.stroke(); ctx.setLineDash([]);
    }
    // Points
    data.forEach((v,i)=>{
      if(v===0) return;
      const lbl=labels[i];
      const isCur=lbl===String(curYear), isCmp=lbl===String(cmpYear), isHov=i===hovIdx;
      const isPartial=incomplete&&incomplete[i];
      const r=isHov?6:(isCur||isCmp)?5:2.5;
      const col=isHov?"#050507":isCur?C_CUR:isCmp?"#394882":"rgba(5,5,7,0.3)";
      ctx.beginPath(); ctx.arc(px(i),py(v),r,0,Math.PI*2);
      if(isPartial){
        // Hollow circle for incomplete
        ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke();
      } else {
        ctx.fillStyle=col; ctx.fill();
      }
      if((isCur||isCmp)&&!isHov&&!xOverride){
        ctx.fillStyle=col; ctx.font="bold 10px 'halyard-text','Inter','Helvetica Neue',Arial,sans-serif";
        ctx.textAlign="center"; ctx.fillText(lbl,px(i),py(v)-10);
      }
    });
    // Restore clip
    ctx.restore();

    // X labels
    ctx.fillStyle=C_LABEL; ctx.font="10px 'halyard-text','Inter','Helvetica Neue',Arial,sans-serif";
    if(xOverride){
      // Horizontal labels for quarterly mode — only show every 3 years to avoid crowding
      ctx.textAlign="center";
      ctx.fillStyle=C_LABEL;
      ctx.font="10px 'halyard-text','Inter','Helvetica Neue',Arial,sans-serif";
      let lastDrawnX=-999;
      xOverride.forEach((lbl,i)=>{
        if(!lbl) return;
        const x=px(i);
        const lblW=ctx.measureText(lbl).width;
        // Skip if too close to previous label or too close to right edge
        if(x-lastDrawnX < 28) return;
        if(x+lblW/2 > W-6) return;
        ctx.fillText(lbl, x, H-6);
        lastDrawnX=x;
      });
    } else {
      // Pick evenly spaced round-year intervals that actually fit
      const approxEvery=Math.ceil(n/8);
      // Snap to nearest multiple of 3 or 5 for clean year intervals
      const snapTo=[1,2,3,4,5,6,8,10];
      const every=snapTo.find(s=>s>=approxEvery)||approxEvery;
      labels.forEach((lbl,i)=>{
        if(i%every!==0) return;
        // Don't draw if too close to right edge (avoid clipping)
        const x=px(i);
        const lblW=ctx.measureText(lbl).width;
        if(x+lblW/2>W-4) return;
        ctx.textAlign="center";
        ctx.fillText(lbl,x,H-6);
      });
      // Always draw last label if it fits and isn't too close to second-last drawn
      const lastI=n-1;
      const lastX=px(lastI);
      const lastLbl=labels[lastI];
      const lastLblW=ctx.measureText(lastLbl).width;
      if(lastX+lastLblW/2<=W-4){
        // Check it won't collide with previous label
        const prevDrawnI=Math.floor(lastI/every)*every;
        if(lastI-prevDrawnI > every*0.4){
          ctx.textAlign="center";
          ctx.fillText(lastLbl,lastX,H-6);
        }
      }
    }
    // Axis
    ctx.strokeStyle=C_AXIS; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PL,PT+cH); ctx.lineTo(PL+cW,PT+cH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PL,PT); ctx.lineTo(PL,PT+cH); ctx.stroke();
  }

  paint(-1);

  const canvas=document.getElementById(id);
  canvas.onmousemove=(e)=>{
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const i=Math.round((mx-PL)/step);
    if(i>=0&&i<n&&data[i]>0){
      paint(i);
      const lbl=labels[i];
      const isPartial=incomplete&&incomplete[i];
      const col=lbl===String(curYear)?C_CUR:lbl===String(cmpYear)?"#217ebe":"#050507";
      const note=isPartial?" (incomplete)":"";
      // Quarterly labels are already "2024 Q1" — show as header, annual/YTD show year
      showTooltip(ttId,canvas,mx,e.clientY-canvas.getBoundingClientRect().top,[
        `<strong>${lbl}${note}</strong>`,
        `<hr style="border:none;border-top:1px solid #ebebeb;margin:5px 0;">`,
        `<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;"><span style="display:inline-block;width:10px;height:10px;background:${col};flex-shrink:0;"></span><span style="font-size:14px;font-weight:700;">${yFormatter ? yFormatter(data[i]) : (rateMode ? data[i].toFixed(1) : Math.round(data[i]).toLocaleString())}</span></div>`,
        `<div style="color:#707175;font-size:11px;">${unitLabel || (rateMode?"per million rides":"complaints")}</div>`
      ]);
    } else { paint(-1); hideTooltip(ttId); }
  };
  canvas.onmouseleave=()=>{ paint(-1); hideTooltip(ttId); };
}

// ── Map rendering ────────────────────────────────────────────────────────────
let GEO_DATA = null;

async function loadGeoData() {
  if (GEO_DATA) return GEO_DATA;
  try {
    const resp = await fetch("precincts.geojson");
    if (!resp.ok) throw new Error("precincts.geojson not found — make sure it is in the same folder as index.html");
    GEO_DATA = await resp.json();
    // Log first feature's property keys to help debug
    if (GEO_DATA.features && GEO_DATA.features.length > 0) {
      console.log("GeoJSON loaded. First feature properties:", Object.keys(GEO_DATA.features[0].properties));
    }
    return GEO_DATA;
  } catch(e) {
    console.warn("Could not load precinct boundaries:", e);
    return null;
  }
}

function renderMap(crimeLabel, curQ, latestYear) {
  crimeLabel = crimeLabel || state.crime;
  curQ = curQ || META.current_quarter;
  latestYear = latestYear || META.current_year;
  const crime = state.crime, loc = state.loc;
  const primaryYear = state.primaryYear || String(META.current_year);
  const cmpYear = state.cmpYear;
  const isPrimaryLatest = String(primaryYear) === String(META.current_year);
  const primaryQ = isPrimaryLatest ? META.current_quarter : "Q4";

  const mapMetric = state.mapMetric || "pct";   // pct | level
  const mapView   = state.mapView   || "count";  // count | rate
  const mapPeriod = state.mapPeriod || "ytd";    // ytd | Q1 | Q2 | Q3 | Q4
  const mapIsRate = mapView === "rate" && loc === "citywide";

  // Disable/grey future quarters
  const curQIdx = QUARTERS.indexOf(curQ);
  document.querySelectorAll("#map-period-toggle button[data-mapperiod]").forEach(btn => {
    const p = btn.dataset.mapperiod;
    if (p === "ytd") { btn.disabled = false; btn.style.opacity = ""; return; }
    const qIdx = QUARTERS.indexOf(p);
    const unavail = qIdx > curQIdx && String(primaryYear) === String(latestYear);
    btn.disabled = unavail;
    btn.style.opacity = unavail ? "0.35" : "";
    if (unavail && state.mapPeriod === p) {
      state.mapPeriod = "ytd";
  state.ridershipView = "monthly";
      document.querySelectorAll("#map-period-toggle button").forEach(b =>
        b.classList.toggle("active", b.dataset.mapperiod === "ytd"));
    }
  });

  // Hide rate button for non-citywide
  const mapViewRate = document.getElementById("map-view-rate");
  if (mapViewRate) {
    mapViewRate.disabled = loc !== "citywide";
    mapViewRate.style.opacity = loc !== "citywide" ? "0.35" : "";
    if (loc !== "citywide" && mapView === "rate") {
      state.mapView = "count";
      document.querySelectorAll("#map-view-toggle button").forEach(b =>
        b.classList.toggle("active", b.dataset.mapview === "count"));
    }
  }
  // Show note when rate is active
  const mapRateNote = document.getElementById("map-rate-note");
  if (mapRateNote) mapRateNote.style.display = mapIsRate ? "block" : "none";

  // Update legend label dynamically
  const mapLegendLabel = document.getElementById("map-legend-label");
  if (mapLegendLabel) {
    const unitStr = mapIsRate ? " per 100k residents" : " complaints";
    const periodStr = mapPeriod === "ytd" ? `YTD Q1–${primaryQ}` : mapPeriod;
    if (mapMetric === "pct") {
      mapLegendLabel.textContent = `% change vs ${cmpYear} · ${periodStr}`;
    } else if (mapMetric === "abs") {
      mapLegendLabel.textContent = `Change in ${unitStr.trim()} vs ${cmpYear} · ${periodStr}`;
    } else {
      mapLegendLabel.textContent = `${unitStr.trim()} · ${periodStr} · ${primaryYear}`;
    }
  }

  const locLabel = loc === "subway" ? "Subway" : loc === "housing" ? "Housing" : "Citywide";
  const periodLabel = mapPeriod === "ytd" ? `YTD Q1–${primaryQ}` : mapPeriod;
  const metricLabel = mapMetric === "pct" ? `% change vs ${cmpYear}` : (mapIsRate ? "per 100k residents" : "complaints");
  document.getElementById("map-sub").textContent =
    `${crimeLabel} · ${locLabel} · ${primaryYear} · ${periodLabel} · ${metricLabel}`;

  loadGeoData().then(geo => {
    const loading = document.getElementById("map-loading");
    if (!geo) {
      if (loading) loading.textContent = "Map data unavailable";
      return;
    }
    if (loading) loading.style.display = "none";

    const canvas = document.getElementById("map-canvas");
    const container = document.getElementById("map-container");
    const W = container.clientWidth;
    const H = container.clientHeight;
    canvas.width = W * devicePixelRatio;
    canvas.height = H * devicePixelRatio;
    canvas.style.width = "100%";
    canvas.style.height = "100%";
    const ctx = canvas.getContext("2d");
    ctx.scale(devicePixelRatio, devicePixelRatio);
    ctx.clearRect(0, 0, W, H);

    // Compute bounds of all precincts
    let minLng=Infinity, maxLng=-Infinity, minLat=Infinity, maxLat=-Infinity;
    geo.features.forEach(f => {
      // MultiPolygon: coordinates = [polygon][ring][point]
      // Polygon: coordinates = [ring][point]
      const polys = f.geometry.type === "MultiPolygon"
        ? f.geometry.coordinates
        : [f.geometry.coordinates];
      polys.forEach(poly => poly.forEach(ring => ring.forEach(([lng,lat]) => {
        if(lng<minLng) minLng=lng; if(lng>maxLng) maxLng=lng;
        if(lat<minLat) minLat=lat; if(lat>maxLat) maxLat=lat;
      })));
    });

    const PAD = 12;
    const scaleX = (W - PAD*2) / (maxLng - minLng);
    const scaleY = (H - PAD*2) / (maxLat - minLat);
    const scale = Math.min(scaleX, scaleY);
    // Center the map within the canvas
    const mapW = (maxLng - minLng) * scale;
    const mapH = (maxLat - minLat) * scale;
    const offX = (W - mapW) / 2;
    const offY = (H - mapH) / 2;

    function project([lng, lat]) {
      return [offX + (lng-minLng)*scale, offY + (maxLat-lat)*scale];
    }

    // Compute pct changes
    const pctChanges = {};
    geo.features.forEach(f => {
      const pct = parseInt(f.properties.precinct || 0);
      if (!pct) return;
      // Use selected map period (YTD or specific quarter)
      let curRaw, prvRaw;
      if (mapPeriod === "ytd") {
        curRaw = getPctYTD(crime, pct, primaryYear, primaryQ, loc);
        prvRaw = getPctYTD(crime, pct, cmpYear, primaryQ, loc);
      } else {
        curRaw = getPctCount(crime, pct, primaryYear, mapPeriod, loc);
        prvRaw = getPctCount(crime, pct, cmpYear, mapPeriod, loc);
      }
      let cur = curRaw, prv = prvRaw;
      if (mapIsRate && PCT_POP[String(pct)]) {
        const pop = PCT_POP[String(pct)];
        cur = (curRaw / pop) * 100000;
        prv = (prvRaw / pop) * 100000;
      }
      let changePct;
      if (prv > 0) {
        changePct = ((cur - prv) / prv) * 100;
      } else if (cur > 0) {
        changePct = 100; // new complaints where there were none — treat as max increase
      } else {
        changePct = null; // both zero — no data
      }
      pctChanges[pct] = { cur, prv, curRaw, prvRaw, pct: changePct };
    });

    // Dynamic color scale — based on actual data range
    // For level mode, color by the actual value; for change modes, by % or abs change
    // Exclude low-residential precincts from rate scale (Central Park, Midtown)
    const RATE_SKIP = new Set(["14","18","22"]);
    const pctChangesForScale = mapIsRate
      ? Object.fromEntries(Object.entries(pctChanges).filter(([k]) => !RATE_SKIP.has(k)))
      : pctChanges;
    const changeVals = mapMetric === "level"
      ? Object.values(pctChangesForScale).map(c=>c.cur).filter(v=>v!=null&&v>0)
      : mapMetric === "abs"
        ? Object.values(pctChangesForScale).map(c=>c.abs).filter(v=>v!=null)
        : Object.values(pctChangesForScale).map(c=>c.pct).filter(p=>p!=null);
    const maxAbsPct = changeVals.length > 0
      ? Math.max(5, Math.ceil(Math.max(...changeVals.map(Math.abs)) / 5) * 5)
      : 30;
    const SCALE_MAX = Math.min(maxAbsPct, mapMetric === "level" ? Infinity : 60);

    function pctToColor(pctVal) {
      if (pctVal === null) return "#e2e2e2";
      if (mapMetric === "level") {
        // Single-hue: white → orange for level display
        const t = Math.min(1, pctVal / SCALE_MAX);
        return interpolateColor("#efefef", "#ff7c53", t);
      }
      const clamped = Math.max(-SCALE_MAX, Math.min(SCALE_MAX, pctVal));
      if (clamped < 0) {
        const t = Math.abs(clamped) / SCALE_MAX;
        return interpolateColor("#efefef", "#2d8a3e", t);
      } else if (clamped > 0) {
        const t = clamped / SCALE_MAX;
        return interpolateColor("#efefef", "#c0392b", t);
      }
      return "#efefef";
    }
    function interpolateColor(hex1, hex2, t) {
      const r1=parseInt(hex1.slice(1,3),16), g1=parseInt(hex1.slice(3,5),16), b1=parseInt(hex1.slice(5,7),16);
      const r2=parseInt(hex2.slice(1,3),16), g2=parseInt(hex2.slice(3,5),16), b2=parseInt(hex2.slice(5,7),16);
      const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
      return `rgb(${r},${g},${b})`;
    }

    // Draw precincts
    const featurePaths = [];
    geo.features.forEach(f => {
      const pct = parseInt(f.properties.precinct || 0);
      const change = pctChanges[pct];
      // Precincts with very low/no residential population — grey out for rate mode
      // 22 = Central Park, 14 = Midtown South, 18 = Midtown North
      const RATE_SKIP_PCTS = new Set([14, 18, 22]);
      const skipForRate = mapIsRate && RATE_SKIP_PCTS.has(pct);
      const colorVal = skipForRate ? null
                     : mapMetric === "level" ? change?.cur
                     : mapMetric === "abs"   ? change?.abs
                     : change?.pct;
      const fillColor = skipForRate ? "#d8d8d8"
                      : change ? pctToColor(colorVal) : "#e8e6df";

      ctx.beginPath();
      const polys = f.geometry.type === "MultiPolygon"
        ? f.geometry.coordinates : [f.geometry.coordinates];
      polys.forEach(poly => poly.forEach(ring => {
        ring.forEach(([lng,lat], i) => {
          const [x,y] = project([lng,lat]);
          i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
        });
        ctx.closePath();
      }));
      ctx.fillStyle = fillColor;
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // Store for hit testing
      featurePaths.push({ pct, change, geometry: f.geometry });
    });

    // Draw selected precinct outline + centered pill label
    if (state.precinct) {
      geo.features.forEach(f => {
        const pct = parseInt(f.properties.precinct || 0);
        if (pct !== state.precinct) return;
        const polys = f.geometry.type === "MultiPolygon"
          ? f.geometry.coordinates : [f.geometry.coordinates];

        // Thick black outline
        ctx.beginPath();
        polys.forEach(poly => poly.forEach(ring => {
          ring.forEach(([lng,lat], i) => {
            const [x,y] = project([lng,lat]);
            i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
          });
          ctx.closePath();
        }));
        ctx.strokeStyle = "#050507";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Centroid of largest polygon for label placement
        let bestPoly = polys[0], bestArea = 0;
        polys.forEach(poly => {
          const ring = poly[0];
          let area = 0;
          for(let i=0;i<ring.length-1;i++) area += ring[i][0]*ring[i+1][1]-ring[i+1][0]*ring[i][1];
          if(Math.abs(area) > bestArea) { bestArea=Math.abs(area); bestPoly=poly; }
        });
        let sumX=0, sumY=0, cnt=0;
        bestPoly[0].forEach(([lng,lat]) => {
          const [x,y] = project([lng,lat]); sumX+=x; sumY+=y; cnt++;
        });
        const cx = sumX/cnt, cy = sumY/cnt;

        // Measure text for pill size
        ctx.font = '700 7px sans-serif';
        const kicW = ctx.measureText("PRECINCT").width;
        ctx.font = '700 15px sans-serif';
        const numW = ctx.measureText(String(pct)).width;
        const pillW = Math.max(kicW, numW) + 18;
        const pillH = 36;

        // White pill background
        ctx.fillStyle = "rgba(255,255,255,0.95)";
        ctx.strokeStyle = "#050507";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(cx - pillW/2, cy - pillH/2, pillW, pillH, 4);
        ctx.fill(); ctx.stroke();

        // "PRECINCT" kicker
        ctx.fillStyle = "#707175";
        ctx.font = '700 7px sans-serif';
        ctx.textAlign = "center";
        ctx.fillText("PRECINCT", cx, cy - 2);

        // Precinct number
        ctx.fillStyle = "#050507";
        ctx.font = '700 15px sans-serif';
        ctx.fillText(String(pct), cx, cy + 13);
      });
    }

    // Legend
    const legendEl = document.getElementById("map-scale");
    if (legendEl) {
      // Render a continuous gradient bar with labels
      const steps = 60;
      const swatches = Array.from({length:steps},(_,i)=>{
        const pctVal = -SCALE_MAX + (i/steps)*SCALE_MAX*2;
        return pctToColor(pctVal);
      });
      const gradientCss = `linear-gradient(to right, ${swatches.join(",")})`;
      if (mapMetric === "level") {
        legendEl.innerHTML = `
          <span style="font-size:10px;color:var(--text3);margin-right:4px;">0</span>
          <span style="display:inline-block;width:160px;height:14px;background:${gradientCss};border:1px solid rgba(0,0,0,0.12);vertical-align:middle;"></span>
          <span style="font-size:10px;font-weight:700;color:#ff7c53;margin-left:4px;">${SCALE_MAX}${mapIsRate?" per 100k":""}</span>
        `;
      } else if (mapMetric === "abs") {
        legendEl.innerHTML = `
          <span style="font-size:10px;font-weight:700;color:#2d8a3e;margin-right:4px;">−${SCALE_MAX}</span>
          <span style="display:inline-block;width:160px;height:14px;background:${gradientCss};border:1px solid rgba(0,0,0,0.12);vertical-align:middle;"></span>
          <span style="font-size:10px;font-weight:700;color:#c0392b;margin-left:4px;">+${SCALE_MAX}</span>
          <span style="font-size:10px;color:var(--text3);margin-left:8px;">vs ${cmpYear}</span>
        `;
      } else {
        legendEl.innerHTML = `
          <span style="font-size:10px;font-weight:700;color:#2d8a3e;margin-right:4px;">−${SCALE_MAX}%</span>
          <span style="display:inline-block;width:160px;height:14px;background:${gradientCss};border:1px solid rgba(0,0,0,0.12);vertical-align:middle;"></span>
          <span style="font-size:10px;font-weight:700;color:#c0392b;margin-left:4px;">+${SCALE_MAX}%</span>
          <span style="font-size:10px;color:var(--text3);margin-left:8px;">vs ${cmpYear}</span>
        `;
      }
    }

    // Tooltip on hover
    function hitTest(mx, my) {
      for (const {pct, change, geometry} of featurePaths) {
        ctx.beginPath();
        const hPolys = geometry.type === "MultiPolygon"
          ? geometry.coordinates : [geometry.coordinates];
        hPolys.forEach(poly => poly.forEach(ring => {
          ring.forEach(([lng,lat], i) => {
            const [x,y] = project([lng,lat]);
            i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
          });
          ctx.closePath();
        }));
        if (ctx.isPointInPath(mx * devicePixelRatio, my * devicePixelRatio)) {
          return { pct, change };
        }
      }
      return null;
    }

    canvas.onmousemove = (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const hit = hitTest(mx, my);
      const tt = document.getElementById("map-tooltip");
      if (hit && hit.change) {
        const { pct, change } = hit;
        // Grey-out precincts show a note instead
        const RATE_SKIP_PCTS_TT = new Set([14, 18, 22]);
        if (mapIsRate && RATE_SKIP_PCTS_TT.has(pct)) {
          tt.innerHTML = `<strong>${pctLabel(pct)}</strong><br>
            <span style="color:var(--text2);font-size:11px;">Rate unavailable — very low resident population</span>`;
          tt.classList.add("visible");
          const ttW = tt.offsetWidth || 220;
          tt.style.left = (mx + 14) + "px";
          tt.style.top = Math.max(4, my - 30) + "px";
          canvas.style.cursor = "default";
          return;
        }
        const valFmt = mapIsRate ? v => v.toFixed(1) : v => fmt(v);
        const valUnit = mapIsRate ? " per 100k" : " complaints";
        const curDisp = valFmt(change.cur) + valUnit;
        const prvDisp = valFmt(change.prv) + valUnit;
        let mainLine, col;
        if (mapMetric === "level") {
          col = "#ff7c53";
          mainLine = `${curDisp} · ${periodLabel}`;
        } else if (mapMetric === "abs") {
          const diff = change.abs;
          col = diff > 0 ? "#d2232a" : "#2d8a3e";
          const sign = diff >= 0 ? "+" : "";
          mainLine = `${sign}${valFmt(diff)}${valUnit} vs ${cmpYear}`;
        } else {
          const pctVal = change.pct;
          col = pctVal == null ? "#707175" : pctVal > 0 ? "#d2232a" : "#2d8a3e";
          mainLine = pctVal == null ? "—"
            : (pctVal > 0 ? "▲ +" : "▼ ") + pctVal.toFixed(1) + `% vs ${cmpYear}`;
        }
        // Color swatch
        const swatchCol = mapMetric === "level" ? "#ff7c53"
          : mainLine.startsWith("▲") || mainLine.startsWith("+") ? "#d2232a" : "#57aa4a";
        tt.style.display="block";
        tt.innerHTML = `
          <div style="font-weight:700;font-size:13px;color:#050507;margin-bottom:6px;">${pctLabel(pct)}</div>
          <hr style="border:none;border-top:1px solid #ebebeb;margin:6px 0;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="display:inline-block;width:12px;height:12px;background:${swatchCol};flex-shrink:0;"></span>
            <span style="font-weight:700;color:${col};">${mainLine}</span>
          </div>
          <div style="color:#707175;font-size:11px;line-height:1.8;">
            <div>${primaryYear}: <strong style="color:#050507;">${curDisp}</strong></div>
            <div>${cmpYear}: <strong style="color:#050507;">${prvDisp}</strong></div>
          </div>`;
        tt.classList.add("visible");
        // Position relative to map container (absolute positioning)
        const ttW = tt.offsetWidth || 220;
        const ttH = tt.offsetHeight || 100;
        const W = canvas.offsetWidth, H = canvas.offsetHeight;
        let left = mx + 16, top = my - ttH/2;
        if (left + ttW > W - 8) left = mx - ttW - 16;
        if (top < 4) top = 4;
        if (top + ttH > H - 4) top = H - ttH - 4;
        if (top + ttH > H - 4) top = H - ttH - 4;
        tt.style.left = left + "px";
        tt.style.top = top + "px";
        canvas.style.cursor = "pointer";
      } else {
        tt.classList.remove("visible");
        canvas.style.cursor = "default";
      }
    };
    canvas.onmouseleave = () => {
      document.getElementById("map-tooltip").classList.remove("visible");
    };
    canvas.onclick = (e) => {
      const rect = canvas.getBoundingClientRect();
      const hit = hitTest(e.clientX - rect.left, e.clientY - rect.top);
      if (hit) {
        // Select this precinct's borough and precinct
        const boroughForPct = PCT_BOROUGH[hit.pct];
        if (boroughForPct) {
          state.borough = boroughForPct;
          state.precinct = hit.pct;
          const boroSel = document.getElementById("sel-borough");
          if (boroSel) boroSel.value = boroughForPct;
          updatePrecinctDropdown();
          const pctSel = document.getElementById("sel-precinct");
          if (pctSel) pctSel.value = String(hit.pct);
          render();
        }
      }
    };
  });
}

// ── Boot ─────────────────────────────────────────────────────────────────────
async function boot() {
  let raw;
  try {
    const resp=await fetch("crime_data.json");
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    raw=await resp.json();
  } catch(err) {
    document.getElementById("app").innerHTML=`
      <div class="state-screen">
        <h2>Data file not found</h2>
        <p>Place <code>crime_data.json</code> in the same folder as this HTML file, then reload.<br><br>
        Generate it in RStudio with: <code>source("fetch_nypd_data.R")</code></p>
      </div>`;
    return;
  }
  META=raw.meta;
  META.crime_groups=raw.crime_groups||[];
  META.crime_types=raw.crime_types||[];
  META.subway_ridership=raw.subway_ridership||{};
  META.ridership_notes=raw.ridership_notes||[];
  META.population=raw.population||{};
  DATA=raw.data;
  // pct_data is split by location type
  const rawPct = raw.pct_data||{};
  PCT_DATA = {
    citywide: rawPct.citywide||{},
    subway:   rawPct.subway||{},
    housing:  rawPct.housing||{}
  };
  MONTHLY_DATA = raw.monthly_data || {};
  const rawPctMonthly = raw.pct_monthly_data || {};
  PCT_MONTHLY_DATA = {
    citywide: rawPctMonthly.citywide || rawPctMonthly,  // backward compat
    subway:   rawPctMonthly.subway   || {},
    housing:  rawPctMonthly.housing  || {}
  };
  PCT_POP = raw.precinct_population || {};
  buildApp();
  render();
}

// CSV DOWNLOAD FUNCTIONALITY
// ─────────────────────────────────────────────────────────────────────────────
function downloadCsv(filename, rows) {
  const csv = rows.map(row =>
    row.map(cell => {
      if (cell == null) return "";
      const s = String(cell);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
    }).join(",")
  ).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildCsvFilename(chartLabel) {
  const crime = (state.crime || "all-crime").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g,"");
  const loc = state.loc;
  const geo = state.precinct ? `pct-${state.precinct}` : state.borough === "All boroughs" ? "citywide" : state.borough.toLowerCase().replace(/ /g,"-");
  const pri = state.primaryYear, cmp = state.cmpYear;
  return `nyc-crime_${crime}_${loc}_${geo}_${chartLabel}_${pri}-vs-${cmp}.csv`;
}

function csvHandlers() {
  const primaryYear = state.primaryYear || String(META.current_year);
  const cmpYear = state.cmpYear;
  const crime = state.crime, loc = state.loc, boro = state.borough;
  const pct = state.precinct, inPctMode = !!pct;
  const isPrimaryLatest = String(primaryYear) === String(META.current_year);
  const primaryQ = isPrimaryLatest ? META.current_quarter : "Q4";
  const isRate = state.subwayRate;

  function getVal(year, q) {
    const raw = inPctMode ? getPctCount(crime, pct, year, q, loc)
                          : getC(crime, loc, boro, year, q);
    if (!isRate) return raw;
    const r = toRate(raw, loc, boro, year, q, null);
    return r == null ? "" : r;
  }
  function getYtdVal(year, upTo) {
    const raw = inPctMode ? getPctYTD(crime, pct, year, upTo, loc)
                          : getYTD(crime, loc, boro, year, upTo);
    if (!isRate) return raw;
    const r = toRate(raw, loc, boro, year, null, upTo);
    return r == null ? "" : r;
  }

  const unit = isRate ? (loc === "subway" ? "per_million_rides" : "per_100k_residents") : "count";

  return {
    qtr: () => {
      const rows = [["Quarter", `${primaryYear}_${unit}`, `${cmpYear}_${unit}`, "pct_change"]];
      QUARTERS.forEach(q => {
        const p = getVal(primaryYear, q), c = getVal(cmpYear, q);
        const pc = (typeof p === "number" && typeof c === "number" && c > 0)
          ? ((p - c) / c * 100).toFixed(1) : "";
        rows.push([q, p, c, pc]);
      });
      downloadCsv(buildCsvFilename("quarter-by-quarter"), rows);
    },
    monthly: () => {
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const rows = [["Month", `${primaryYear}_${unit}`, `${cmpYear}_${unit}`]];
      months.forEach((m, i) => {
        const mo = i + 1;
        let pVal, cVal;
        if (inPctMode) {
          pVal = getPctMonthlyCount(crime, pct, primaryYear, mo, loc);
          cVal = getPctMonthlyCount(crime, pct, cmpYear, mo, loc);
        } else {
          pVal = getMonthlyCount(crime, loc, boro, primaryYear, mo);
          cVal = getMonthlyCount(crime, loc, boro, cmpYear, mo);
        }
        if (isRate) {
          const pR = toRate(pVal, loc, boro, primaryYear, "Q"+Math.ceil(mo/3), null);
          const cR = toRate(cVal, loc, boro, cmpYear, "Q"+Math.ceil(mo/3), null);
          pVal = pR == null ? "" : pR;
          cVal = cR == null ? "" : cR;
        }
        rows.push([m, pVal, cVal]);
      });
      downloadCsv(buildCsvFilename("monthly"), rows);
    },
    trend: () => {
      const mode = state.trendMode || "ytd";
      const rows = [];
      const dataYears = getAllYears();
      const maxYr = parseInt(primaryYear);
      const trendWindow = state.trendWindow || "all";
      const windowStart = trendWindow === "10yr" ? maxYr - 9
                        : trendWindow === "prepandemic" ? 2019
                        : trendWindow === "5yr" ? maxYr - 4 : 2006;
      const minYr = Math.max(windowStart, Math.min(...dataYears, 2006));
      if (mode === "ytd") {
        rows.push(["Year", `${unit}_ytd_through_${primaryQ}`]);
        for (let y = minYr; y <= maxYr; y++) rows.push([y, getYtdVal(y, primaryQ)]);
      } else if (mode === "quarterly") {
        rows.push(["Year_Quarter", unit]);
        for (let y = minYr; y <= maxYr; y++) {
          QUARTERS.forEach(q => {
            if (y === maxYr && QUARTERS.indexOf(q) > QUARTERS.indexOf(primaryQ)) return;
            rows.push([`${y} ${q}`, getVal(y, q)]);
          });
        }
      } else {
        rows.push(["Year", `${unit}_annual`]);
        for (let y = minYr; y <= maxYr; y++) rows.push([y, getYtdVal(y, "Q4")]);
      }
      downloadCsv(buildCsvFilename(`long-term-trend-${mode}`), rows);
    },
    boro: () => {
      if (loc === "subway") {
        const rView = state.ridershipView || "monthly";
        const rows = [];
        if (rView === "monthly") {
          const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
          rows.push(["Month", `${primaryYear}_rides`, `${cmpYear}_rides`]);
          months.forEach((m, i) => {
            rows.push([m, getSubwayRidershipMonth(primaryYear, i+1) || "", getSubwayRidershipMonth(cmpYear, i+1) || ""]);
          });
        } else {
          rows.push(["Year", `total_rides_${rView === "ytd" ? "ytd" : "annual"}`]);
          const dataYears = getAllYears();
          const maxYr = parseInt(primaryYear);
          const trendWindow = state.trendWindow || "all";
          const windowStart = trendWindow === "10yr" ? maxYr - 9
                            : trendWindow === "prepandemic" ? 2019
                            : trendWindow === "5yr" ? maxYr - 4 : 2006;
          const minYr = Math.max(windowStart, Math.min(...dataYears, 2006));
          const isYtd = rView === "ytd";
          const excludeCurrent = !isYtd && String(primaryYear) === String(META.current_year) && primaryQ !== "Q4";
          for (let y = minYr; y <= maxYr; y++) {
            if (excludeCurrent && y === maxYr) continue;
            const quarters = ["Q1","Q2","Q3","Q4"];
            const upToIdx = isYtd ? quarters.indexOf(primaryQ) : 3;
            let total = 0;
            for (let i = 0; i <= upToIdx; i++) total += getSubwayRidership(y, quarters[i]) || 0;
            rows.push([y, total]);
          }
        }
        downloadCsv(buildCsvFilename(`subway-ridership-${state.ridershipView||"monthly"}`), rows);
      } else {
        const rows = [["Borough", `${primaryYear}_${unit}`]];
        ["Bronx","Brooklyn","Manhattan","Queens","Staten Island"].forEach(b => {
          const rawVal = getYTD(crime, loc, b, primaryYear, primaryQ);
          if (isRate && loc === "citywide") {
            const r = toRate(rawVal, loc, b, primaryYear, null, primaryQ);
            rows.push([b, r == null ? "" : r]);
          } else {
            rows.push([b, rawVal]);
          }
        });
        downloadCsv(buildCsvFilename("by-borough"), rows);
      }
    },
    movers: () => {
      const mode = state.moversMode || "pct";
      const rows = [["Direction", "Crime type", `${primaryYear}_count`, `${cmpYear}_count`, "abs_change", "pct_change"]];
      const items = [];
      META.crime_types.forEach(cr => {
        const cur = inPctMode ? getPctYTD(cr, pct, primaryYear, primaryQ, loc)
                              : getYTD(cr, loc, boro, primaryYear, primaryQ);
        const prv = inPctMode ? getPctYTD(cr, pct, cmpYear, primaryQ, loc)
                              : getYTD(cr, loc, boro, cmpYear, primaryQ);
        if (cur + prv < 10) return;
        const abs = cur - prv;
        const pctC = prv > 0 ? ((cur - prv) / prv * 100) : (cur > 0 ? 100 : null);
        items.push({crime: cr, cur, prv, abs, pctC});
      });
      const sorter = mode === "pct"
        ? (a,b) => (b.pctC ?? -Infinity) - (a.pctC ?? -Infinity)
        : (a,b) => b.abs - a.abs;
      const sorted = [...items].sort(sorter);
      sorted.slice(0, 5).forEach(x => rows.push(["increase", x.crime, x.cur, x.prv, x.abs, x.pctC == null ? "" : x.pctC.toFixed(1)]));
      [...sorted].reverse().slice(0, 5).forEach(x => rows.push(["decrease", x.crime, x.cur, x.prv, x.abs, x.pctC == null ? "" : x.pctC.toFixed(1)]));
      downloadCsv(buildCsvFilename(`top-movers-${mode}`), rows);
    }
  };
}

// Wire CSV button clicks (global delegation)
document.addEventListener("click", (e) => {
  const csvBtn = e.target.closest(".csv-btn[data-csv]");
  if (csvBtn) {
    const chart = csvBtn.dataset.csv;
    const handlers = csvHandlers();
    if (handlers[chart]) handlers[chart]();
    return;
  }
  if (e.target.id === "download-full-dataset") {
    fetch("crime_data.json")
      .then(r => r.blob())
      .then(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "nyc-crime-full-dataset.json";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
  }
});

boot();
</script>
<script>
  (function() {
    function sendHeight() {
      const height = document.documentElement.scrollHeight;
      parent.postMessage({ type: 'vc-qcd-resize', height }, '*');
    }

    window.addEventListener('load', sendHeight);
    new ResizeObserver(sendHeight).observe(document.body);
  })();
</script>
